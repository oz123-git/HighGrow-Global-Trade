name: Fix hero image asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix base64 image decoding
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")
          old = 'base64.b64decode(p.read_text(encoding="utf-8").strip())'
          new = 'base64.b64decode(p.read_text(encoding="utf-8").strip().replace("\\\\/", "/"))'
          if old in text:
              p.write_text(text.replace(old, new), encoding="utf-8")
          else:
              print("Target expression already fixed or not found.")

      - name: Remove one-time fixer
        run: rm -f .github/workflows/fix_hero_image.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix_hero_image.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix hero image decoding"
            git push
          fi
